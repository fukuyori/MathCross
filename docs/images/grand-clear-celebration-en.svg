<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF3CF"/>
      <stop offset="0.45" stop-color="#F5B84B"/>
      <stop offset="1" stop-color="#BC6B2F"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFDF6"/>
      <stop offset="1" stop-color="#FFF0C7"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF4D7"/>
      <stop offset="1" stop-color="#E6B56D"/>
    </linearGradient>
    <linearGradient id="peach" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFD9C4"/>
      <stop offset="1" stop-color="#F19B77"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#5A3218" flood-opacity="0.24"/>
    </filter>
    <filter id="tileShadow" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="5" flood-color="#2B1A10" flood-opacity="0.24"/>
    </filter>
    <style>
      .title { font: 900 58px -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif; fill: #1A2430; text-anchor: middle; }
      .sub { font: 800 31px -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif; fill: #7A4B24; text-anchor: middle; }
      .tile { font: 900 44px -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif; fill: #182230; text-anchor: middle; dominant-baseline: central; }
      .card { font: 900 42px -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif; fill: #007F67; text-anchor: middle; dominant-baseline: central; }
    </style>
  </defs>

  <rect width="1200" height="1200" fill="url(#bg)"/>
  <path d="M-80 162 C228 58 388 190 655 92 S1008 20 1280 104" fill="none" stroke="#FFF9DB" stroke-width="58" opacity="0.34"/>
  <path d="M-90 735 C208 608 430 748 680 660 S1002 576 1295 644" fill="none" stroke="#7B401E" stroke-width="56" opacity="0.16"/>
  <circle cx="150" cy="142" r="9" fill="#E51D35"/>
  <circle cx="1030" cy="190" r="10" fill="#E51D35"/>
  <circle cx="965" cy="900" r="8" fill="#FFFFFF" opacity="0.75"/>
  <circle cx="210" cy="940" r="8" fill="#FFFFFF" opacity="0.8"/>

  <rect x="70" y="58" width="1060" height="1082" rx="46" fill="url(#panel)" filter="url(#shadow)"/>
  <rect x="96" y="84" width="1008" height="1030" rx="30" fill="none" stroke="#FFFFFF" stroke-width="3" opacity="0.7"/>

  <text x="600" y="146" class="title">All Levels Cleared!</text>
  <text x="600" y="198" class="sub">Congratulations</text>

  <g transform="translate(392 330)">
    <rect x="0" y="0" width="78" height="78" rx="11" fill="url(#wood)" stroke="#1E2A37" stroke-width="5" filter="url(#tileShadow)"/>
    <text x="39" y="41" class="tile">12</text>
    <rect x="82" y="0" width="78" height="78" rx="11" fill="url(#wood)" stroke="#1E2A37" stroke-width="5"/>
    <text x="121" y="41" class="tile">+</text>
    <rect x="164" y="0" width="78" height="78" rx="11" fill="url(#wood)" stroke="#1E2A37" stroke-width="5"/>
    <text x="203" y="41" class="tile">9</text>
    <rect x="246" y="0" width="78" height="78" rx="11" fill="url(#wood)" stroke="#1E2A37" stroke-width="5"/>
    <text x="285" y="41" class="tile">=</text>
    <rect x="328" y="0" width="78" height="78" rx="11" fill="url(#peach)" stroke="#C3765A" stroke-width="5" filter="url(#tileShadow)"/>
    <text x="367" y="41" class="card">21</text>
  </g>

  <g transform="translate(190 392)">
